# STL Master public beta nginx config for app.stlmaster.online.
# Install as /etc/nginx/sites-available/stl-master-beta, enable with a symlink,
# then run certbot --nginx -d app.stlmaster.online.

server {
    listen 80;
    server_name app.stlmaster.online;

    client_max_body_size 120M;

    location ^~ /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/html;
    }

    location /health {
        auth_basic "STL Master Beta";
        auth_basic_user_file /etc/nginx/.stl-master-beta.htpasswd;

        proxy_pass http://127.0.0.1:8000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 60s;
    }

    location /api/ {
        auth_basic "STL Master Beta";
        auth_basic_user_file /etc/nginx/.stl-master-beta.htpasswd;

        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 60s;
    }

    location / {
        auth_basic "STL Master Beta";
        auth_basic_user_file /etc/nginx/.stl-master-beta.htpasswd;

        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 60s;
    }
}
